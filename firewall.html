<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firewall Rule Lab | Security+</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #f0f4f8;
    --panel: #ffffff;
    --panel2: #f7f9fc;
    --border: #d0dae8;
    --border2: #b8c9de;
    --accent: #1a5fa8;
    --accent-light: #e8f1fb;
    --accent2: #c0392b;
    --accent2-light: #fdf0ef;
    --accent3: #1a7a3a;
    --accent3-light: #eaf5ee;
    --gold: #8a6200;
    --gold-light: #fff8e6;
    --text: #1e2d3d;
    --muted: #6b7d93;
    --correct: #eaf5ee;
    --correct-border: #1a7a3a;
    --wrong: #fdf0ef;
    --wrong-border: #c0392b;
    --rule-bg: #f9fbfd;
    --rule-alt: #f2f6fb;
    --header-bg: #1a3a5c;
    --warmup-accent: #5b2d8e;
    --warmup-light: #f3eeff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    background: var(--header-bg);
    padding: 22px 40px 18px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  }

  .shield-icon {
    width: 44px; height: 44px;
    border: 2px solid rgba(255,255,255,0.35);
    clip-path: polygon(50% 0%, 100% 20%, 100% 70%, 50% 100%, 0% 70%, 0% 20%);
    background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.55rem;
    letter-spacing: 0.08em;
    color: #ffffff;
    text-transform: uppercase;
  }

  .header-text p {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .badge {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 4px 12px;
    letter-spacing: 0.1em;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 32px 60px;
  }

  /* Score panel */
  .score-panel {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .score-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 14px 24px;
    flex: 1;
    text-align: center;
  }

  .score-item + .score-item { border-left: 1px solid var(--border); }

  .score-label {
    font-size: 0.62rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  .score-value {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--accent);
    line-height: 1;
  }

  /* Progress */
  .progress-bar-outer {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin-bottom: 6px;
    overflow: hidden;
  }

  .progress-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #2ecc71);
    transition: width 0.5s ease;
    border-radius: 3px;
  }

  .progress-label {
    font-size: 0.68rem;
    color: var(--muted);
    text-align: right;
    margin-bottom: 22px;
    letter-spacing: 0.04em;
  }

  /* Section labels */
  .section-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .section-label-pill {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    padding: 3px 10px;
    border-radius: 2px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .pill-warmup {
    background: var(--warmup-light);
    color: var(--warmup-accent);
    border: 1px solid rgba(91,45,142,0.25);
  }

  .pill-security {
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid rgba(26,95,168,0.25);
  }

  .section-label-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Scenario card */
  .scenario-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 28px;
    margin-bottom: 18px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }

  .scenario-card.warmup-card {
    border-top: 3px solid var(--warmup-accent);
  }

  .scenario-card.security-card {
    border-top: 3px solid var(--accent);
  }

  .scenario-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 14px;
  }

  .scenario-num {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.62rem;
    color: var(--muted);
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 3px;
    letter-spacing: 0.08em;
    white-space: nowrap;
    margin-top: 3px;
    flex-shrink: 0;
  }

  .scenario-num.warmup-num {
    color: var(--warmup-accent);
    background: var(--warmup-light);
    border-color: rgba(91,45,142,0.2);
  }

  .scenario-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1.12rem;
    color: var(--text);
    letter-spacing: 0.03em;
    line-height: 1.3;
  }

  .scenario-desc {
    font-size: 0.875rem;
    color: #3d5066;
    line-height: 1.65;
    margin-top: 4px;
  }

  .tag-pill {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.58rem;
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 0.06em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .tag-vuln {
    background: var(--accent2-light);
    color: var(--accent2);
    border: 1px solid rgba(192,57,43,0.25);
  }

  .tag-warmup {
    background: var(--warmup-light);
    color: var(--warmup-accent);
    border: 1px solid rgba(91,45,142,0.2);
  }

  /* Rule table */
  .rule-table-wrapper {
    margin: 18px 0;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
  }

  thead tr {
    background: #eaf0f8;
    border-bottom: 2px solid var(--border2);
  }

  thead th {
    padding: 10px 14px;
    text-align: left;
    color: var(--accent);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 600;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    background: var(--rule-bg);
  }

  tbody tr:nth-child(even) { background: var(--rule-alt); }
  tbody tr:hover { background: #edf4ff; }

  td { padding: 9px 14px; color: var(--text); }

  .rule-num { color: var(--muted); font-size: 0.72rem; }
  .allow { color: var(--accent3); font-weight: 600; }
  .deny { color: var(--accent2); font-weight: 600; }
  .any-val { color: #8a6200; }
  .default-allow { color: var(--accent2); font-weight: 600; }

  .highlight-rule { background: #fffbea !important; }
  .highlight-rule td { color: #6b4700 !important; }
  .highlight-rule .allow { color: #1a7a3a !important; }
  .highlight-rule .deny { color: var(--accent2) !important; }

  /* Questions */
  .questions-section { margin-top: 6px; }

  .question-block {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 0.9rem;
    color: var(--text);
    margin-bottom: 14px;
    line-height: 1.55;
    font-weight: 500;
  }

  .q-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-right: 6px;
  }

  .q-label.warmup-q { color: var(--warmup-accent); }

  .options-grid { display: grid; gap: 7px; }

  .option-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.84rem;
    padding: 10px 14px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border-radius: 5px;
    line-height: 1.45;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-light);
    color: var(--accent);
  }

  .option-btn:disabled { cursor: default; }

  .option-btn.correct {
    background: var(--correct);
    border-color: var(--correct-border);
    color: #0f5c28;
  }

  .option-btn.wrong {
    background: var(--wrong);
    border-color: var(--wrong-border);
    color: #922b21;
  }

  .option-letter {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    min-width: 18px;
    margin-top: 2px;
    flex-shrink: 0;
    font-weight: 600;
  }

  .option-btn.correct .option-letter { color: var(--accent3); }
  .option-btn.wrong .option-letter { color: var(--accent2); }

  /* Feedback */
  .feedback-box {
    display: none;
    margin-top: 10px;
    padding: 12px 16px;
    font-size: 0.83rem;
    line-height: 1.6;
    border-left: 3px solid;
    border-radius: 0 5px 5px 0;
  }

  .feedback-box.show { display: block; }
  .feedback-box.correct-fb { border-color: var(--correct-border); background: var(--correct); color: #0d4d22; }
  .feedback-box.wrong-fb { border-color: var(--wrong-border); background: var(--wrong); color: #7b241c; }
  .feedback-box strong { display: block; margin-bottom: 4px; font-size: 0.88rem; }

  /* Concept note */
  .concept-note {
    font-size: 0.8rem;
    color: #3d5066;
    border-left: 3px solid var(--border2);
    padding-left: 14px;
    margin-top: 14px;
    line-height: 1.7;
    background: var(--panel2);
    border-radius: 0 5px 5px 0;
    padding: 10px 14px;
  }

  .concept-note strong { color: var(--accent); font-size: 0.78rem; letter-spacing: 0.06em; }

  .warmup-concept { border-left-color: var(--warmup-accent); }
  .warmup-concept strong { color: var(--warmup-accent); }

  /* Navigation */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 24px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .nav-btn {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 24px;
    border: 2px solid;
    cursor: pointer;
    background: transparent;
    transition: all 0.18s;
    border-radius: 5px;
  }

  .nav-btn.primary { border-color: var(--accent); color: var(--accent); }
  .nav-btn.primary:hover { background: var(--accent); color: #fff; }
  .nav-btn.secondary { border-color: var(--border2); color: var(--muted); }
  .nav-btn.secondary:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover { background: transparent; }

  /* Results */
  #results-screen {
    display: none;
    text-align: center;
    padding: 50px 20px;
  }

  .result-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 2.4rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .result-sub {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  .result-score-big {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 5rem;
    color: var(--accent3);
    line-height: 1;
    margin-bottom: 4px;
  }

  .result-score-label {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .result-grade {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 10px 28px;
    display: inline-block;
    margin-bottom: 36px;
    letter-spacing: 0.08em;
    border-radius: 4px;
  }

  .grade-pass { border: 2px solid var(--correct-border); color: var(--accent3); background: var(--correct); }
  .grade-fail { border: 2px solid var(--wrong-border); color: var(--accent2); background: var(--wrong); }

  .result-breakdown {
    display: flex;
    justify-content: center;
    gap: 50px;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }

  .breakdown-item { display: flex; flex-direction: column; gap: 4px; }
  .breakdown-num { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 2.2rem; }
  .breakdown-lbl { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

  .restart-btn {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 12px 36px;
    border: 2px solid var(--accent);
    color: var(--accent);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 5px;
  }

  .restart-btn:hover { background: var(--accent); color: #fff; }

  @media (max-width: 680px) {
    header { padding: 16px 18px; }
    .main { padding: 18px 14px 40px; }
    .scenario-card { padding: 16px 14px; }
    .score-item { padding: 10px 14px; }
    .badge { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="shield-icon">&#128737;</div>
  <div class="header-text">
    <h1>Firewall Rule Analysis Lab</h1>
    <p>Security+ SY0-701 &mdash; Network Security &mdash; Rule Reading &amp; Misconfiguration Analysis</p>
  </div>
  <div class="badge">CYB300 // ECPI</div>
</header>

<div class="main">
  <div id="lab-screen">

    <div class="score-panel">
      <div class="score-item">
        <span class="score-label">Score</span>
        <span class="score-value" id="score-display" style="color:var(--accent)">0%</span>
      </div>
      <div class="score-item">
        <span class="score-label">Correct</span>
        <span class="score-value" id="correct-display" style="color:var(--accent3)">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">Incorrect</span>
        <span class="score-value" id="wrong-display" style="color:var(--accent2)">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">Scenario</span>
        <span class="score-value" id="scenario-display" style="color:var(--gold)">1 / 8</span>
      </div>
    </div>

    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progress-label">0% Complete</div>

    <div id="scenario-container"></div>

    <div class="nav-row">
      <button class="nav-btn secondary" id="prev-btn" onclick="navigate(-1)" disabled>&#8592; Previous</button>
      <button class="nav-btn primary" id="next-btn" onclick="navigate(1)">Next Scenario &#8594;</button>
    </div>

  </div>

  <div id="results-screen">
    <div class="result-title">Lab Complete</div>
    <div class="result-sub">Firewall Rule Analysis &mdash; Session Results</div>
    <div class="result-score-big" id="final-pct">0%</div>
    <div class="result-score-label">Final Score</div>
    <div id="final-grade" class="result-grade"></div>
    <div class="result-breakdown">
      <div class="breakdown-item">
        <span class="breakdown-num" id="final-correct" style="color:var(--accent3)">0</span>
        <span class="breakdown-lbl">Correct</span>
      </div>
      <div class="breakdown-item">
        <span class="breakdown-num" id="final-wrong" style="color:var(--accent2)">0</span>
        <span class="breakdown-lbl">Incorrect</span>
      </div>
      <div class="breakdown-item">
        <span class="breakdown-num" id="final-total" style="color:var(--gold)">0</span>
        <span class="breakdown-lbl">Total Questions</span>
      </div>
    </div>
    <button class="restart-btn" onclick="restartLab()">Restart Lab</button>
  </div>
</div>

<script>
const scenarios = [
  // ============================================================
  // WARM-UP 1 — Traffic Matching
  // ============================================================
  {
    id: 1,
    type: "warmup",
    title: "Warm-Up: Will This Traffic Be Allowed?",
    tag: "Rule Reading",
    context: "Before analyzing security issues, you need to be able to read a ruleset and trace how a packet moves through it. Firewalls evaluate rules top-down and stop at the FIRST match. Read the ruleset below and answer each traffic question.",
    rules: [
      { num: 1, name: "Allow-Web-In",   src: "ANY",           dst: "10.0.0.50", proto: "TCP", port: "443",  action: "ALLOW", highlight: false },
      { num: 2, name: "Allow-DNS-Out",  src: "10.0.0.0/24",   dst: "8.8.8.8",   proto: "UDP", port: "53",   action: "ALLOW", highlight: false },
      { num: 3, name: "Block-Telnet",   src: "ANY",           dst: "10.0.0.50", proto: "TCP", port: "23",   action: "DENY",  highlight: false },
      { num: 4, name: "Allow-Internal", src: "10.0.0.0/24",   dst: "10.0.0.50", proto: "TCP", port: "ANY",  action: "ALLOW", highlight: false },
      { num: 5, name: "Deny-All",       src: "ANY",           dst: "ANY",        proto: "ANY", port: "ANY",  action: "DENY",  highlight: false },
    ],
    questions: [
      {
        text: "Traffic: Source = 203.0.113.5 (internet), Destination = 10.0.0.50, Protocol = TCP, Port = 443. Which rule matches first, and what happens to this packet?",
        options: [
          "Rule 1 matches — the packet is ALLOWED",
          "Rule 4 matches — the packet is ALLOWED",
          "Rule 5 matches — the packet is DENIED",
          "No rule matches — the packet passes through"
        ],
        correct: 0,
        feedback: {
          correct: "Rule 1 matches immediately. It permits TCP port 443 from ANY source to 10.0.0.50. The firewall stops evaluating after the first match, so Rules 2 through 5 are never checked for this packet. The packet is allowed.",
          wrong: "Work top-down. Rule 1 checks: source ANY (203.0.113.5 qualifies), destination 10.0.0.50 (matches), protocol TCP (matches), port 443 (matches). That is a match — stop here. The packet is allowed by Rule 1."
        }
      },
      {
        text: "Traffic: Source = 10.0.0.15, Destination = 10.0.0.50, Protocol = TCP, Port = 23 (Telnet). Which rule matches first?",
        options: [
          "Rule 3 — Block-Telnet — the packet is DENIED",
          "Rule 4 — Allow-Internal — the packet is ALLOWED (internal hosts bypass Telnet block)",
          "Rule 5 — Deny-All — the packet is DENIED",
          "Rule 1 — Allow-Web-In — the packet is ALLOWED"
        ],
        correct: 0,
        feedback: {
          correct: "Rule 3 matches before Rule 4. Even though 10.0.0.15 is an internal host and Rule 4 would allow it, Rule 3 appears higher in the list. Since Rule 3 (Block-Telnet) matches — source ANY, destination 10.0.0.50, TCP port 23 — the firewall denies the packet without ever reaching Rule 4. Rule order determines outcome.",
          wrong: "Even though the source is internal, the firewall still processes rules top-down. Before it reaches Rule 4 (Allow-Internal), it hits Rule 3 (Block-Telnet), which matches ANY source to 10.0.0.50 on TCP/23. Rule 3 fires first and denies the packet."
        }
      },
      {
        text: "Traffic: Source = 10.0.0.22, Destination = 8.8.8.8, Protocol = UDP, Port = 53 (DNS). Which rule matches?",
        options: [
          "Rule 1 — Allow-Web-In",
          "Rule 2 — Allow-DNS-Out — the packet is ALLOWED",
          "Rule 5 — Deny-All — the packet is DENIED",
          "Rule 4 — Allow-Internal"
        ],
        correct: 1,
        feedback: {
          correct: "Rule 2 matches. It allows UDP port 53 from the 10.0.0.0/24 subnet to 8.8.8.8 specifically. The source (10.0.0.22) falls within that subnet, the destination and port match, so Rule 2 fires and the packet is allowed.",
          wrong: "Check each rule top-down. Rule 1 is for TCP/443 to 10.0.0.50 — no match. Rule 2 is for UDP/53 from 10.0.0.0/24 to 8.8.8.8 — source 10.0.0.22 is in the /24, destination and port match. Rule 2 fires."
        }
      }
    ],
    concept: "KEY SKILL: Always trace packets top-down through the ruleset. Stop at the first match. The action on that first matching rule is what the firewall applies. Packet attributes that must ALL match: source IP, destination IP, protocol, and port."
  },

  // ============================================================
  // WARM-UP 2 — Redundant & Unreachable Rules
  // ============================================================
  {
    id: 2,
    type: "warmup",
    title: "Warm-Up: Redundant and Unreachable Rules",
    tag: "Rule Reading",

// State
let currentScenario = 0;
let answers = {};
let correct = 0;
let wrong = 0;
let totalAnswered = 0;
const totalQuestions = scenarios.reduce((s, sc) => s + sc.questions.length, 0);
const totalScenarios = scenarios.length;

function renderScenario(idx) {
  const sc = scenarios[idx];
  const isWarmup = sc.type === 'warmup';
  const cardClass = isWarmup ? 'warmup-card' : 'security-card';

  let sectionHtml = '';
  // Show section label on first warmup and first security scenario
  if (idx === 0) {
    sectionHtml = `<div class="section-label"><span class="section-label-pill pill-warmup">Warm-Up: Rule Reading</span><span class="section-label-line"></span></div>`;
  } else if (idx === 2) {
    sectionHtml = `<div class="section-label"><span class="section-label-pill pill-security">Security Analysis</span><span class="section-label-line"></span></div>`;
  }

  let html = sectionHtml + `
    <div class="scenario-card ${cardClass}">
      <div class="scenario-header">
        <span class="scenario-num ${isWarmup ? 'warmup-num' : ''}">${isWarmup ? 'WARM-UP' : 'SCENARIO'} ${sc.id} / ${totalScenarios}</span>
        <div>
          <div class="scenario-title">${sc.title} <span class="tag-pill ${isWarmup ? 'tag-warmup' : 'tag-vuln'}">${sc.tag}</span></div>
          <div class="scenario-desc" style="margin-top:5px">${sc.context}</div>
        </div>
      </div>

      <div class="rule-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Rule Name</th><th>Source</th><th>Destination</th><th>Proto</th><th>Port</th><th>Action</th>
            </tr>
          </thead>
          <tbody>
  `;

  sc.rules.forEach(r => {
    const hlClass = r.highlight ? ' class="highlight-rule"' : '';
    const actionClass = r.action === 'ALLOW' ? 'allow' : r.action === 'DENY' ? 'deny' : 'default-allow';
    const srcCls = (r.src === 'ANY' || r.src === '---') ? 'any-val' : '';
    const dstCls = (r.dst === 'ANY' || r.dst === '---') ? 'any-val' : '';
    html += `
      <tr${hlClass}>
        <td class="rule-num">${r.num}</td>
        <td>${r.name}</td>
        <td class="${srcCls}">${r.src}</td>
        <td class="${dstCls}">${r.dst}</td>
        <td>${r.proto}</td>
        <td>${r.port}</td>
        <td class="${actionClass}">${r.action}</td>
      </tr>`;
  });

  html += `</tbody></table></div><div class="questions-section">`;

  sc.questions.forEach((q, qi) => {
    const key = `${idx}_${qi}`;
    const answered = answers[key] !== undefined;
    const chosen = answers[key];
    const qLabelClass = isWarmup ? 'warmup-q' : '';

    html += `<div class="question-block">
      <div class="question-text"><span class="q-label ${qLabelClass}">Q${qi+1}.</span> ${q.text}</div>
      <div class="options-grid">`;

    ['A','B','C','D'].forEach((letter, oi) => {
      let cls = '';
      if (answered) {
        if (oi === q.correct) cls = 'correct';
        else if (oi === chosen && chosen !== q.correct) cls = 'wrong';
      }
      html += `
        <button class="option-btn ${cls}" ${answered ? 'disabled' : ''} onclick="answerQuestion(${idx},${qi},${oi})">
          <span class="option-letter">${letter}.</span>
          <span>${q.options[oi]}</span>
        </button>`;
    });

    html += `</div>`;

    if (answered) {
      const isCorrect = chosen === q.correct;
      html += `<div class="feedback-box ${isCorrect ? 'correct-fb' : 'wrong-fb'} show">
        <strong>${isCorrect ? 'Correct' : 'Incorrect'}</strong>
        ${isCorrect ? q.feedback.correct : q.feedback.wrong}
      </div>`;
    } else {
      html += `<div class="feedback-box"></div>`;
    }

    html += `</div>`;
  });

  html += `</div>`;

  const conceptClass = isWarmup ? 'concept-note warmup-concept' : 'concept-note';
  const conceptIcon = isWarmup ? '&#128218;' : '&#128161;';
  html += `<div class="${conceptClass}"><strong>${conceptIcon} ${isWarmup ? 'SKILL NOTE' : 'CONCEPT'}</strong> &mdash; ${sc.concept}</div>`;
  html += `</div>`;

  document.getElementById('scenario-container').innerHTML = html;
  updateUI();
}

function answerQuestion(si, qi, chosen) {
  const key = `${si}_${qi}`;
  if (answers[key] !== undefined) return;
  answers[key] = chosen;

  const isCorrect = chosen === scenarios[si].questions[qi].correct;
  if (isCorrect) correct++; else wrong++;
  totalAnswered++;

  const pct = Math.round((correct / totalQuestions) * 100);
  document.getElementById('score-display').textContent = pct + '%';
  document.getElementById('correct-display').textContent = correct;
  document.getElementById('wrong-display').textContent = wrong;

  updateProgress();
  renderScenario(si);
}

function navigate(dir) {
  currentScenario = Math.max(0, Math.min(totalScenarios - 1, currentScenario + dir));
  renderScenario(currentScenario);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateUI() {
  document.getElementById('prev-btn').disabled = currentScenario === 0;
  document.getElementById('scenario-display').textContent = `${currentScenario + 1} / ${totalScenarios}`;
  const nextBtn = document.getElementById('next-btn');
  const isLast = currentScenario === totalScenarios - 1;
  if (isLast) {
    nextBtn.textContent = 'View Results';
    const allDone = Object.keys(answers).length >= totalQuestions;
    nextBtn.onclick = allDone ? showResults : () => {};
    nextBtn.disabled = !allDone;
  } else {
    nextBtn.textContent = 'Next Scenario \u2192';
    nextBtn.onclick = () => navigate(1);
    nextBtn.disabled = false;
  }
}

function updateProgress() {
  const pct = Math.round((totalAnswered / totalQuestions) * 100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = pct + '% Complete (' + totalAnswered + ' / ' + totalQuestions + ' questions answered)';
}

function showResults() {
  document.getElementById('lab-screen').style.display = 'none';
  document.getElementById('results-screen').style.display = 'block';
  const pct = Math.round((correct / totalQuestions) * 100);
  document.getElementById('final-pct').textContent = pct + '%';
  document.getElementById('final-correct').textContent = correct;
  document.getElementById('final-wrong').textContent = wrong;
  document.getElementById('final-total').textContent = totalQuestions;
  const gradeEl = document.getElementById('final-grade');
  if (pct >= 70) {
    gradeEl.textContent = 'PASS — Solid Understanding of Firewall Concepts';
    gradeEl.className = 'result-grade grade-pass';
  } else {
    gradeEl.textContent = 'REVIEW NEEDED — Revisit Firewall Rule Principles';
    gradeEl.className = 'result-grade grade-fail';
  }
}

function restartLab() {
  currentScenario = 0; answers = {}; correct = 0; wrong = 0; totalAnswered = 0;
  document.getElementById('score-display').textContent = '0%';
  document.getElementById('correct-display').textContent = '0';
  document.getElementById('wrong-display').textContent = '0';
  document.getElementById('scenario-display').textContent = '1 / ' + totalScenarios;
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('progress-label').textContent = '0% Complete';
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('lab-screen').style.display = 'block';
  renderScenario(0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderScenario(0);
updateProgress();
</script>
</body>
</html>
